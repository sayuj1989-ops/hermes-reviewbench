# One-off helper: export the built reviewer image as a downloadable artifact
# (used to validate the exact ghcr image locally without a packages-scoped token).
name: Export image
on:
  workflow_dispatch: {}
permissions:
  contents: read
  packages: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker pull ghcr.io/${{ github.repository_owner }}/hermes-reviewbench@sha256:f1f041db951962fc544e793941a37a4f7f75d1cc9ea8deca3542634eed451cd7
          docker tag ghcr.io/${{ github.repository_owner }}/hermes-reviewbench@sha256:f1f041db951962fc544e793941a37a4f7f75d1cc9ea8deca3542634eed451cd7 hermes-reviewbench:dev
          docker save hermes-reviewbench:dev | gzip > hermes-reviewbench.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-reviewbench-image
          path: hermes-reviewbench.tar.gz
